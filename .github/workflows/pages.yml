# Publishes site/ (the static DeadLoad website and policy generator) to the gh-pages branch, which
# GitHub Pages serves (Settings > Pages: Deploy from a branch, gh-pages, / root). The Actions
# artifact deployment was tried first and never received a status from Pages on this repository,
# so the site is published as a branch: site/ becomes the branch root through git subtree split.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test the policy generator
        run: node --test tests/site/*.test.mjs

      - name: Publish site/ to gh-pages
        run: |
          git subtree split --prefix site -b gh-pages-publish
          git push --force origin gh-pages-publish:gh-pages
